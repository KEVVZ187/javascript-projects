<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Utente Casuale</title>
</head>
<body>
    
    <h1>Card Utente Casuale</h1>
    <table border="1">
        <tr>
            <th>Foto</td>
            <th>Nome</td>
            <th>Email</td>
            <th>Città</td>
        </tr>
        <tr id="user-card"></tr>

        <!--
        <tr>
            <td><div style="background-color: red; height: 150px; width: 150px;">Foto</div></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    -->
    </table>
    <br>
    
    <button id="generate">Genera Utente</button>
    <button id="Save">Salva preferito</button>

    <h2>Lista dei preferiti salvati:</h2>
    <table id="userSaved" border="1">
        <tr>
            <th>Foto</td>
            <th>Nome</td>
            <th>Email</td>
            <th>Città</td>
        </tr>
    </table>

    <script>
        /*
        Per il progetto finale ti propongo una Card Utente Casuale — semplice ma completo:

Bottone "Genera utente" che chiama l'API randomuser.me
Mostra foto, nome, email e città in una card CSS
Bottone "Salva preferito" che salva l'utente in localStorage
Lista dei preferiti salvati sotto

Userai: async/await, fetch, try/catch, localStorage, classList, DOM, eventi.
        
        
        */
        // USERS
        let users = [];
        let UsersList = [];

        // UPDATE LIST
        function updateTableSaved() {
            let userString = localStorage.getItem("userList");
            // TRASFORMA LA STRINGA IN OBJECT
            let UserList = JSON.parse((userString));
            UsersList = UserList;
            let i = 0;
            document.getElementById("userSaved").innerHTML = "";
            while (i < UsersList.length) {
                document.getElementById("userSaved").innerHTML += 
                "<tr>" +
                " <td>" + "<img src='" + UsersList[i].Foto + "' alt='Photuser'>" + "</td> " +
                " <td>" + UsersList[i].Nome + "</td> " +
                " <td>" + UsersList[i].Email + "</td> " +
                " <td>" + UsersList[i].Citta + "</td> " +
                "</tr>";
                i++;
            }
        }

        if (localStorage.getItem("userList") !== null) {
            usersList = JSON.parse(localStorage.getItem("userList"));
            updateTableSaved();
        } else {
            
        }

        // GENERATE
        document.getElementById("generate").addEventListener("click", function() {
            fetch("https://randomuser.me/api/")
            .then(risposta => risposta.json())
            .then(dati => {
                // METTE I DATI DEL USER DENTRO LA VARIABILE
                users.push(
                    {
                        Foto:   dati.results[0].picture.medium,
                        Nome:   dati.results[0].name.first,
                        Email:  dati.results[0].email,
                        Citta:  dati.results[0].location.city
                    }
                );
                // STAMPA USER CARD
                document.getElementById("user-card").innerHTML = 
                    " <td>" + "<img src='" + dati.results[0].picture.medium + "' alt='Photo user'>" + "</td> " +
                    " <td>" + dati.results[0].name.first + "</td> " +
                    " <td>" + dati.results[0].email + "</td> " +
                    " <td>" + dati.results[0].location.city + "</td> ";
                // SALVARE SU LOCALSTORAGE USER -- LISTA PER USER SALVATI
                localStorage.setItem("usersSaved", JSON.stringify(users));
            })
        })
        // SAVE USER LIST
        document.getElementById("Save").addEventListener("click", function() {
            // CREAMO UNA VARIABILE PER USER CHE è STATO SCELTO
            let userPicked = document.getElementById("user-card");
            // CONTROLLA SE è STATO GENERATO
            if (userPicked.innerHTML == '') {
                window.alert("Per favore genera un utente!");
            } else {
                // PRENDERE I DATI DEL USER IN LOCAL STORAGE è lo transforma in stringa -- LISTA PER SALVATI
                let userString = localStorage.getItem("usersSaved");
                // TRASFORMA LA STRINGA IN OBJECT
                let UserList = JSON.parse((userString));
                UsersList = UserList;
                console.log(UsersList);
                if (UserList == null) {
                    window.alert("Non puoi aggiungere la stessa persona!");
                } else {
                    let i = 0;
                    document.getElementById("userSaved").innerHTML = "";
                    while (i < UsersList.length) {
                        document.getElementById("userSaved").innerHTML += 
                        "<tr>" +
                        " <td>" + "<img src='" + UsersList[i].Foto + "' alt='Photo user'>" + "</td> " +
                        " <td>" + UsersList[i].Nome + "</td> " +
                        " <td>" + UsersList[i].Email + "</td> " +
                        " <td>" + UsersList[i].Citta + "</td> " +
                        "</tr>";
                        i++;
                    }
                    // RIMUOVERE SU LOCALSTORAGE USER -- LISTA PER USER SALVATI
                    localStorage.removeItem("usersSaved");
                    // SALVA SU LOCALSTORAGE
                    localStorage.setItem("userList", JSON.stringify(UsersList));
                    updateTableSaved();
                }
            }
            
        })


    </script>
</body>
</html>
